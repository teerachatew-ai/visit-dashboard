services:
  - type: web
    name: visit-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false          # paste your Upstash REST URL in the Render dashboard
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false          # paste your Upstash REST token in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.12.7
